server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 8.141.3.78;

    ssl_certificate /etc/letsencrypt/live/8.141.3.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.141.3.78/privkey.pem;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    # GitHub App webhook is configured to use the default HTTPS port.
    location = /api/github/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location = /forge {
        return 308 /forge/;
    }

    location ^~ /forge/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ (^|/)index\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
