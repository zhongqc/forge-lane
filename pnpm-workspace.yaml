packages:
  - apps/desktop
  - packages/cli
allowBuilds:
  electron-winstaller: false
  electron: true
  better-sqlite3: true
  esbuild: true
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - electron@45.5.0

overrides:
  '@prisma/adapter-better-sqlite3>better-sqlite3': 13.2.0
