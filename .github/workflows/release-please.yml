name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo 'Configure the RELEASE_PLEASE_TOKEN repository secret before running release-please.' >&2
            exit 1
          fi

      - name: Create GitHub release for merged release PR
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: pnpm exec release-please github-release --repo-url="$GITHUB_REPOSITORY" --token="$RELEASE_PLEASE_TOKEN" --target-branch=main

      - name: Create or update release PR
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: pnpm exec release-please release-pr --repo-url="$GITHUB_REPOSITORY" --token="$RELEASE_PLEASE_TOKEN" --target-branch=main
